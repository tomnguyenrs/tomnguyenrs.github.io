bio: |
  Nguyen Quoc Nhan (Tom) is a PhD student in Information Management and Finance
  at National Yang Ming Chiao Tung University (NYCU), Taiwan. His research spans
  corporate finance, banking, and corporate governance, as well as the evolution
  of finance research itself. His work has been published in the Review of
  Quantitative Finance and Accounting and the Journal of Economic Surveys.

